version: '3.8'

services:
  # PostgreSQL with PostGIS extension
  postgres:
    image: postgis/postgis:16-3.4
    container_name: civicpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: civicpulse
      POSTGRES_USER: civicpulse_user
      POSTGRES_PASSWORD: civicpulse_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicpulse_user -d civicpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO S3-compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: civicpulse-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  miniodata:
